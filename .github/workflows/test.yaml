name: Run tests suite

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/setup

      - name: Test
        run: pnpm test:once

      - name: Test coverage
        run: pnpm test:cov